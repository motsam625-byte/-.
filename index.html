<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>برنامج الطبيب - نظام إدارة العيادات والوصفة الإلكترونية</title>
<style>
  :root{
    --bg:#eef2f6; --panel:#f7f9fc; --border:#c9d3df; --header:#dbe5f1;
    --primary:#1e6fbf; --primary-d:#0f4f8f; --accent:#2aa56b;
    --danger:#c0392b; --warn:#d49a1d; --text:#1f2937; --muted:#5b6776;
    --row-alt:#f1f5fb; --row-hover:#d8e6f5; --shadow:0 6px 18px rgba(15,40,80,.08);
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;font-family:"Segoe UI","Tahoma",Arial,sans-serif;background:var(--bg);color:var(--text);font-size:14px}
  button{font-family:inherit;cursor:pointer}
  input,select,textarea{font-family:inherit;font-size:14px;border:1px solid var(--border);background:#fff;padding:6px 8px;border-radius:4px;outline:none}
  input:focus,select:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 2px rgba(30,111,191,.18)}
  table{border-collapse:collapse;width:100%;background:#fff;font-size:13px}
  th{background:var(--header);color:#0f3a66;font-weight:700;padding:7px 6px;border:1px solid var(--border);text-align:center}
  td{padding:6px;border:1px solid #dde4ec;text-align:center}
  tbody tr:nth-child(even){background:var(--row-alt)}
  tbody tr:hover{background:var(--row-hover);cursor:pointer}
  tbody tr.sel{background:#c9ddf3 !important;font-weight:600}

  .topbar{display:flex;align-items:center;justify-content:space-between;background:linear-gradient(180deg,#fff,#eaf0f8);border-bottom:1px solid var(--border);padding:6px 14px;height:42px}
  .topbar .menu{display:flex;gap:18px;color:#37495e;font-size:13px}
  .topbar .menu span{cursor:pointer;padding:4px 6px;border-radius:4px}
  .topbar .menu span:hover{background:#dce6f2;color:var(--primary-d)}
  .brand{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--primary-d)}
  .brand .logo{width:30px;height:30px;border-radius:6px;background:var(--primary);color:#fff;display:grid;place-items:center;font-weight:900}

  .app{display:grid;grid-template-rows:42px 1fr 28px;height:100vh}
  .main{display:grid;grid-template-columns:340px 1fr;overflow:hidden}
  .sidebar{background:linear-gradient(180deg,#fff,#eef3fb);border-left:1px solid var(--border);display:flex;flex-direction:column;align-items:center;padding:18px 14px;gap:8px}
  .doctor{width:220px;height:220px;background:#fff;border-radius:50%;display:grid;place-items:center;box-shadow:var(--shadow);overflow:hidden;border:6px solid #fff}
  .doctor svg{width:170px;height:170px}
  .sidebar h1{font-size:30px;color:var(--primary-d);margin:14px 0 0}
  .sidebar .ver{color:var(--muted);font-size:12px;margin-bottom:8px}
  .stats-mini{margin-top:auto;width:100%;display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .stat{background:#fff;border:1px solid var(--border);border-radius:6px;padding:8px;text-align:center}
  .stat .n{color:var(--primary-d);font-size:20px;font-weight:800}
  .stat .l{color:var(--muted);font-size:12px}

  .content{background:var(--bg);overflow:auto;padding:18px}
  .statusbar{display:flex;justify-content:space-between;align-items:center;background:#fff;border-top:1px solid var(--border);padding:0 14px;font-size:12px;color:var(--muted)}

  .module-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;max-width:680px;margin:20px auto}
  .module{background:#fff;border:1px solid var(--border);border-radius:8px;padding:18px 10px;text-align:center;transition:.15s;box-shadow:0 1px 0 #fff inset, 0 2px 6px rgba(20,50,90,.04)}
  .module:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--primary)}
  .module .ico{width:54px;height:54px;margin:0 auto 8px;display:grid;place-items:center;border-radius:10px;background:#eaf2fb;color:var(--primary-d)}
  .module .ico svg{width:32px;height:32px}
  .module .lbl{font-weight:700;color:#26425f}
  .module.exit .ico{background:#fde8e6;color:var(--danger)}
  .module.set .ico{background:#fff4dd;color:var(--warn)}

  .page{background:#fff;border:1px solid var(--border);border-radius:8px;overflow:hidden;box-shadow:var(--shadow)}
  .page-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;background:linear-gradient(180deg,#eaf2fb,#dceaf7);border-bottom:1px solid var(--border)}
  .page-head .title{display:flex;align-items:center;gap:12px;color:var(--primary-d);font-size:24px;font-weight:800}
  .page-head .title svg{width:32px;height:32px}
  .page-head .right{display:flex;gap:10px;align-items:center}
  .chip{background:#fff;border:1px solid var(--border);border-radius:6px;padding:6px 12px;display:flex;align-items:center;gap:8px;color:#26425f;font-weight:600}
  .chip .num{background:var(--primary);color:#fff;border-radius:4px;padding:2px 10px;min-width:28px;text-align:center}

  .page-body{padding:14px}
  .toolbar{display:flex;flex-wrap:wrap;gap:6px;padding:10px;background:#f3f6fb;border:1px solid var(--border);border-radius:6px;margin-top:10px}
  .btn{display:inline-flex;align-items:center;gap:6px;background:linear-gradient(180deg,#fff,#e8eef6);border:1px solid var(--border);color:#26425f;padding:7px 12px;border-radius:5px;font-weight:600;font-size:13px}
  .btn:hover{background:#dceaf7;border-color:var(--primary)}
  .btn.primary{background:linear-gradient(180deg,var(--primary),var(--primary-d));color:#fff;border-color:var(--primary-d)}
  .btn.primary:hover{filter:brightness(1.05)}
  .btn.success{background:linear-gradient(180deg,#2aa56b,#1d8a55);color:#fff;border-color:#1d8a55}
  .btn.danger{background:linear-gradient(180deg,#e25c4d,#b3392b);color:#fff;border-color:#a83020}
  .btn.warn{background:linear-gradient(180deg,#f3c14a,#c9941b);color:#3a2c00;border-color:#b18316}
  .btn.wa{background:linear-gradient(180deg,#25d366,#128c4f);color:#fff;border-color:#0d6a3a}
  .btn svg{width:16px;height:16px}

  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .row > label{color:#26425f;font-weight:600;min-width:70px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
  .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .panel{background:#fff;border:1px solid var(--border);border-radius:6px;padding:10px}
  .panel h3{margin:0 0 10px;color:var(--primary-d);font-size:14px;border-bottom:1px dashed var(--border);padding-bottom:6px}

  .tabs{display:flex;gap:2px;border-bottom:2px solid var(--primary);margin:10px 0}
  .tab{padding:8px 14px;background:#e8eef6;border:1px solid var(--border);border-bottom:none;border-radius:6px 6px 0 0;cursor:pointer;font-weight:600;color:#26425f;font-size:13px}
  .tab.active{background:var(--primary);color:#fff;border-color:var(--primary)}

  .modal-back{position:fixed;inset:0;background:rgba(20,40,70,.45);display:none;align-items:center;justify-content:center;z-index:50}
  .modal-back.show{display:flex}
  .modal{background:#fff;border-radius:10px;min-width:420px;max-width:92vw;max-height:90vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.3);animation:pop .2s}
  @keyframes pop{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
  .modal-head{display:flex;justify-content:space-between;align-items:center;background:linear-gradient(180deg,var(--primary),var(--primary-d));color:#fff;padding:10px 14px}
  .modal-head h3{margin:0;font-size:16px}
  .modal-head .x{background:transparent;border:none;color:#fff;font-size:22px;cursor:pointer}
  .modal-body{padding:16px}
  .modal-foot{padding:10px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;background:#f6f8fc}

  .toast{position:fixed;bottom:40px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 18px;border-radius:6px;z-index:99;opacity:0;transition:.3s}
  .toast.show{opacity:1;bottom:60px}

  .login{position:fixed;inset:0;background:linear-gradient(135deg,#1e6fbf,#0f3a66);display:flex;align-items:center;justify-content:center;z-index:100}
  .login.hide{display:none}
  .login-box{background:#fff;border-radius:12px;padding:30px 36px;min-width:360px;box-shadow:0 25px 60px rgba(0,0,0,.4)}
  .login-box h2{margin:0 0 6px;color:var(--primary-d);text-align:center}
  .login-box p{margin:0 0 20px;color:var(--muted);text-align:center;font-size:13px}
  .login-box label{display:block;color:#26425f;font-weight:600;margin:10px 0 4px}
  .login-box input{width:100%}
  .login-box .btn{width:100%;justify-content:center;margin-top:16px;padding:10px}

  .print-only{display:none}
  @media print{
    body * {visibility:hidden}
    .print-area, .print-area *{visibility:visible}
    .print-area{position:absolute;inset:0;padding:20px}
    .print-only{display:block}
    .no-print{display:none !important}
  }
  .rx-sheet{background:#fff;padding:24px;max-width:780px;margin:0 auto;border:1px solid #ccc}
  .rx-head{display:flex;justify-content:space-between;border-bottom:2px solid var(--primary);padding-bottom:10px;margin-bottom:14px}
  .rx-head h2{margin:0;color:var(--primary-d)}
  .rx-info{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px;font-size:14px}
  .rx-block{margin-top:14px}
  .rx-block h4{margin:0 0 6px;background:#eaf2fb;padding:6px 10px;border-right:4px solid var(--primary);color:var(--primary-d)}
  .rx-block ul{margin:6px 0;padding-right:22px}

  .pill{display:inline-block;padding:2px 8px;border-radius:10px;font-size:12px;font-weight:700}
  .pill.wait{background:#fff4dd;color:#8a5a00}
  .pill.done{background:#d9f3e2;color:#1b6b3b}
  .pill.cancel{background:#fde2dd;color:#8a1f12}

  .empty{text-align:center;color:var(--muted);padding:40px;font-size:14px}
  .log-entry{padding:4px 8px;border-bottom:1px solid #eee;font-size:12px}
</style>
</head>
<body>

<div class="login" id="login">
  <div class="login-box">
    <h2>برنامج الطبيب</h2>
    <p>نظام إدارة العيادات والوصفة الإلكترونية</p>
    <label>اسم المستخدم</label>
    <input id="lg-user" value="ADMIN" />
    <label>كلمة المرور</label>
    <input id="lg-pass" type="password" value="123" />
    <button class="btn primary" onclick="doLogin()">دخول</button>
    <p style="margin-top:14px;font-size:12px">الافتراضي: ADMIN / 123</p>
  </div>
</div>

<div class="app">
  <div class="topbar">
    <div class="brand">
      <div class="logo">ط</div>
      <div>برنامج الطبيب <span style="color:var(--muted);font-weight:400;font-size:12px">v8.0</span></div>
    </div>
    <div class="menu">
      <span onclick="go('home')">الرئيسية</span>
      <span onclick="go('settings')">الإعدادات</span>
      <span onclick="go('stats')">إحصائيات</span>
      <span onclick="exportData()">نسخ احتياطي</span>
      <span onclick="importData()">استرداد</span>
      <span onclick="logout()" style="color:var(--danger)">تسجيل خروج</span>
    </div>
  </div>

  <div class="main">
    <aside class="sidebar">
      <div class="doctor">
        <svg viewBox="0 0 200 200">
          <circle cx="100" cy="80" r="40" fill="#f5d7b8"/>
          <path d="M60 80c0-30 18-48 40-48s40 18 40 48v6c0 4-4 6-8 6H68c-4 0-8-2-8-6z" fill="#3b2317"/>
          <ellipse cx="86" cy="85" rx="4" ry="5" fill="#222"/>
          <ellipse cx="114" cy="85" rx="4" ry="5" fill="#222"/>
          <path d="M86 105q14 12 28 0" stroke="#222" stroke-width="3" fill="none" stroke-linecap="round"/>
          <path d="M50 200v-50c0-22 22-30 50-30s50 8 50 30v50z" fill="#fff" stroke="#cfd5db" stroke-width="2"/>
          <path d="M85 120l15 30 15-30" fill="none" stroke="#cfd5db" stroke-width="2"/>
          <path d="M80 130c-10 5-14 18-10 30" stroke="#3aa6c9" stroke-width="3" fill="none"/>
          <path d="M120 130c10 5 14 18 10 30" stroke="#3aa6c9" stroke-width="3" fill="none"/>
          <circle cx="125" cy="165" r="6" fill="#3aa6c9"/>
        </svg>
      </div>
      <h1>برنامج الطبيب</h1>
      <div class="ver">Version : 8.0</div>
      <div class="stats-mini">
        <div class="stat"><div class="n" id="mini-today">0</div><div class="l">حجوزات اليوم</div></div>
        <div class="stat"><div class="n" id="mini-wait">0</div><div class="l">في الانتظار</div></div>
        <div class="stat"><div class="n" id="mini-pat">0</div><div class="l">إجمالي المرضى</div></div>
        <div class="stat"><div class="n" id="mini-cash">0</div><div class="l">خزينة اليوم</div></div>
      </div>
    </aside>

    <section class="content" id="content"></section>
  </div>

  <div class="statusbar">
    <span>المستخدم: <b id="sb-user">ADMIN</b></span>
    <span>فرع رقم : <b>8</b></span>
    <span id="sb-clinic">مركز الورد</span>
    <span id="sb-date"></span>
  </div>
</div>

<div class="toast" id="toast"></div>
<div class="modal-back" id="modal"></div>

<script>
/* ==================== دوال أساسية ==================== */
const LS_KEY='clinic_db_v1';
const defaultDB={
  settings:{clinic:'مركز الورد',branch:8,doctor:'د. محمد مرتضى',price:100,
    waMsg:'السلام عليكم، نؤكد حضرتكم لميعاد الحجز لدينا بتاريخ {date} - {time}.',
    instructionsTemplates:['تناول الدواء بكثرة الماء يوميا','الراحة التامة لمدة 3 أيام','الامتناع عن الأطعمة الدهنية'],
    complaintsTemplates:['صداع','ألم في البطن','ارتفاع حرارة','سعال','دوار'],
    labsTemplates:[{group:'CBC',tests:['Hb','WBC','RBC','PLT']},{group:'Liver',tests:['ALT','AST','ALP','Bilirubin']},{group:'Kidney',tests:['Urea','Creatinine','Na','K']}],
    radioTemplates:[{name:'X-Ray',regions:['Chest','Knee','Spine']},{name:'CT',regions:['Brain','Abdomen']},{name:'MRI',regions:['Brain','Spine']}],
    medicines:['Augmentin 1g','Panadol 500mg','Brufen 400mg','Ventolin Inhaler','Nexium 40mg','Concor 5mg']
  },
  users:[{u:'ADMIN',p:'123',role:'admin'}],
  patients:[], bookings:[], visits:[], cash:[], purchases:[], operations:[], log:[]
};

/* --- معالجة البيانات والتخزين --- */
function escapeHTML(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

let DB = load();
function load(){
  try{
    const raw = JSON.parse(localStorage.getItem(LS_KEY));
    if (raw) {
      // فك تشفير كلمات المرور من localStorage
      if (raw.users) raw.users.forEach(u => { if (u.p) u.p = atob(u.p); });
      return {...defaultDB, ...raw, settings:{...defaultDB.settings, ...(raw.settings||{})}};
    }
  }catch(e){}
  // لا توجد بيانات، استخدم الافتراضيات
  const fresh = structuredClone(defaultDB);
  fresh.log.push({time:new Date().toISOString(),msg:'تم إنشاء قاعدة بيانات جديدة'});
  return fresh;
}
function save(){
  const cloned = JSON.parse(JSON.stringify(DB));
  cloned.users.forEach(u => { if (u.p) u.p = btoa(u.p); });
  localStorage.setItem(LS_KEY, JSON.stringify(cloned));
  refreshMini();
}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}

const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2200)}
function modal({title,body,foot}){
  const m=$('#modal');
  m.innerHTML=`<div class="modal"><div class="modal-head"><h3>${escapeHTML(title)}</h3><button class="x" onclick="closeModal()">×</button></div><div class="modal-body">${body}</div>${foot?`<div class="modal-foot">${foot}</div>`:''}</div>`;
  m.classList.add('show'); return m;
}
function closeModal(){$('#modal').classList.remove('show');$('#modal').innerHTML=''}
function confirmBox(msg,cb){
  modal({title:'تأكيد',body:`<p>${escapeHTML(msg)}</p>`,foot:`<button class="btn" onclick="closeModal()">إلغاء</button><button class="btn danger" id="cf-ok">تأكيد</button>`});
  $('#cf-ok').onclick=()=>{closeModal();cb()};
}
function fmtDate(d){const x=new Date(d);return x.toLocaleDateString('en-GB')}
function todayISO(){return new Date().toISOString().slice(0,10)}

/* --- سجل النشاطات --- */
function addLog(msg){
  if(!DB.log) DB.log=[];
  DB.log.push({time:new Date().toISOString(),msg:msg});
}

/* --- التنقل بين الصفحات --- */
const pages={};
function go(p,arg){ if(!pages[p]) p='home'; $('#content').innerHTML=''; pages[p]($('#content'),arg); window.scrollTo(0,0); refreshMini(); }

/* ===== HOME ===== */
pages.home=(root)=>{
  const items=[
    ['bookings','الحجز',iconCalendar()],
    ['exam','الكشف',iconStethoscope()],
    ['operations','العمليات',iconUser()],
    ['search','بحث',iconSearch()],
    ['dues','المستحقات',iconMoney()],
    ['cash','الخزينة',iconSafe()],
    ['purchases','المشتريات',iconBox(),''],
    ['stats','إحصائيات',iconChart()],
    ['users','تغيير مستخدم',iconUserSwitch()],
    ['data','البيانات',iconFolder()],
    ['log','سجل النشاطات',iconLog()],
    ['settings','الإعدادات',iconGear(),'set'],
    ['exit','خروج',iconExit(),'exit']
  ];
  root.innerHTML=`<div class="page-head" style="background:transparent;border:none;padding:0;justify-content:center;flex-direction:column">
    <div class="title">نظام إدارة العيادات والوصفة الإلكترونية</div>
    <div style="color:var(--muted);margin-top:4px">اختر الوحدة المطلوبة للبدء</div>
  </div>
  <div class="module-grid">${items.map(([k,l,svg,c=''])=>`
    <div class="module ${c}" onclick="${k==='exit'?'logout()':`go('${k}')`}">
      <div class="ico">${svg}</div><div class="lbl">${l}</div>
    </div>`).join('')}
  </div>`;
};

/* ===== BOOKINGS ===== */
pages.bookings=(root)=>{
  let date = todayISO();
  let q='';
  let selId=null;
  const render=()=>{
    const list = DB.bookings.filter(b=>b.date===date && (!q || (b.name||'').includes(q)));
    root.innerHTML=`
    <div class="page">
      <div class="page-head">
        <div class="title">${iconCalendar()} الحجز</div>
        <div class="right">
          <div class="chip">شاشة الإنتظار <span class="num">${list.filter(x=>x.status==='wait').length}</span></div>
          <div class="chip">منتهية <span class="num">${list.filter(x=>x.status==='done').length}</span></div>
        </div>
      </div>
      <div class="page-body">
        <div class="row">
          <label>بحث :</label><input id="q" value="${escapeHTML(q)}" placeholder="اسم المريض"/>
          <label>التاريخ :</label><input type="date" id="dt" value="${date}"/>
        </div>
        <div style="margin-top:12px">
          <table id="tbl">
            <thead><tr><th>#</th><th>الاسم</th><th>الوقت</th><th>إجمالي</th><th>مدفوع</th><th>خصم</th><th>باقي</th><th>الحالة</th></tr></thead>
            <tbody>${list.length?list.map((b,i)=>`<tr data-id="${b.id}" class="${b.id===selId?'sel':''}">
              <td>${i+1}</td><td>${escapeHTML(b.name)}</td><td>${escapeHTML(b.time||'-')}</td>
              <td>${b.total||0}</td><td>${b.paid||0}</td><td>${b.discount||0}</td>
              <td>${(b.total||0)-(b.paid||0)-(b.discount||0)}</td>
              <td><span class="pill ${b.status}">${b.status==='wait'?'انتظار':b.status==='done'?'تم الكشف':'ملغي'}</span></td>
            </tr>`).join(''):`<tr><td colspan="8" class="empty">لا توجد حجوزات لهذا اليوم</td></tr>`}</tbody>
          </table>
        </div>
        <div class="toolbar">
          <button class="btn success" onclick="bookingForm()">${iconPlus()} إضافة حجز</button>
          <button class="btn warn" id="ed">${iconEdit()} تعديل</button>
          <button class="btn danger" id="dl">${iconTrash()} حذف</button>
          <button class="btn" id="se">${iconSearch()} بحث</button>
          <button class="btn primary" id="ex">${iconStethoscope()} بدء الكشف</button>
          <button class="btn wa" id="wa">${iconWa()} إرسال تذكير</button>
          <button class="btn" onclick="go('home')">${iconExit()} خروج</button>
        </div>
      </div>
    </div>`;
    $('#q').oninput=e=>{q=e.target.value;render()};
    $('#dt').onchange=e=>{date=e.target.value;render()};
    $$('#tbl tbody tr[data-id]').forEach(tr=>tr.onclick=()=>{selId=tr.dataset.id;render()});
    $('#ed').onclick=()=>{if(!selId)return toast('اختر حجزاً');bookingForm(selId)};
    $('#dl').onclick=()=>{if(!selId)return toast('اختر حجزاً');confirmBox('حذف الحجز؟',()=>{DB.bookings=DB.bookings.filter(b=>b.id!==selId);addLog('حذف حجز');save();selId=null;render();toast('تم الحذف')})};
    $('#se').onclick=()=>{const v=prompt('ابحث باسم المريض:');if(v!==null){q=v;render()}};
    $('#ex').onclick=()=>{if(!selId)return toast('اختر حجزاً');const b=DB.bookings.find(x=>x.id===selId);go('examForm',b)};
    $('#wa').onclick=()=>{if(!selId)return toast('اختر حجزاً');const b=DB.bookings.find(x=>x.id===selId);const msg=DB.settings.waMsg.replace('{date}',b.date).replace('{time}',b.time||'');const url=`https://wa.me/${(b.phone||'').replace(/\D/g,'')}?text=${encodeURIComponent(msg)}`;window.open(url,'_blank')};
  };
  render();
};

function bookingForm(id){
  const b = id?{...DB.bookings.find(x=>x.id===id)}:{id:uid(),date:todayISO(),time:'10:00',total:DB.settings.price,paid:0,discount:0,status:'wait',gender:'male',ageU:'سنة'};
  const oldPaid = b.paid || 0;
  modal({title:id?'تعديل حجز':'إضافة حجز جديد',body:`
    <div class="grid2">
      <div><label>اسم المريض</label><input id="f-name" value="${escapeHTML(b.name||'')}" /></div>
      <div><label>الهاتف</label><input id="f-phone" value="${escapeHTML(b.phone||'')}" /></div>
      <div><label>التاريخ</label><input type="date" id="f-date" value="${b.date}"/></div>
      <div><label>الوقت</label><input type="time" id="f-time" value="${b.time||'10:00'}"/></div>
      <div><label>السن</label><input type="number" id="f-age" value="${b.age||0}"/></div>
      <div><label>النوع</label><select id="f-gender"><option value="male" ${b.gender==='male'?'selected':''}>ذكر</option><option value="female" ${b.gender==='female'?'selected':''}>أنثى</option></select></div>
      <div><label>إجمالي</label><input type="number" id="f-total" value="${b.total||0}"/></div>
      <div><label>مدفوع</label><input type="number" id="f-paid" value="${b.paid||0}"/></div>
      <div><label>خصم</label><input type="number" id="f-disc" value="${b.discount||0}"/></div>
      <div><label>الحالة</label><select id="f-status">
        <option value="wait" ${b.status==='wait'?'selected':''}>انتظار</option>
        <option value="done" ${b.status==='done'?'selected':''}>تم الكشف</option>
        <option value="cancel" ${b.status==='cancel'?'selected':''}>ملغي</option>
      </select></div>
      <div style="grid-column:1/-1"><label>ملاحظات</label><textarea id="f-note" rows="2" style="width:100%">${escapeHTML(b.note||'')}</textarea></div>
    </div>`,foot:`<button class="btn" onclick="closeModal()">إلغاء</button><button class="btn success" id="sv">حفظ</button>`});
  $('#sv').onclick=()=>{
    const o={...b,name:$('#f-name').value.trim(),phone:$('#f-phone').value.trim(),date:$('#f-date').value,time:$('#f-time').value,
      age:+$('#f-age').value,gender:$('#f-gender').value,total:+$('#f-total').value,paid:+$('#f-paid').value,discount:+$('#f-disc').value,
      status:$('#f-status').value,note:$('#f-note').value};
    if(!o.name)return toast('أدخل الاسم');
    let p = DB.patients.find(x => x.fileNo === b.fileNo);
    if (!p) p = DB.patients.find(x => x.name === o.name && (x.phone||'') === (o.phone||''));
    if(!p){p={id:uid(),fileNo:1000+DB.patients.length+1,name:o.name,phone:o.phone,age:o.age,gender:o.gender};DB.patients.push(p)}
    o.patientId=p.id; o.fileNo=p.fileNo;
    const i=DB.bookings.findIndex(x=>x.id===o.id);
    if(i>=0){
      if (o.paid !== oldPaid) {
        const diff = o.paid - oldPaid;
        if (diff > 0) DB.cash.push({id:uid(),date:o.date,type:'in',amount:diff,note:'تعديل دفع حجز - '+o.name});
        else if (diff < 0) DB.cash.push({id:uid(),date:o.date,type:'out',amount:Math.abs(diff),note:'تعديل دفع حجز - '+o.name});
      }
      DB.bookings[i]=o;
    } else {
      DB.bookings.push(o);
      if(o.paid>0) DB.cash.push({id:uid(),date:o.date,type:'in',amount:o.paid,note:'دفع حجز - '+o.name});
    }
    addLog(id?'تعديل حجز '+o.name:'إضافة حجز '+o.name);
    save();closeModal();go('bookings');toast('تم الحفظ');
  };
}

window.saveVisit=(id)=>{
  const v = DB.visits.find(x=>x.id===id);
  if (v && window.patient) {
    const p = DB.patients.find(x=>x.id===v.patientId);
    if (p) Object.assign(p, window.patient);
  }
  addLog('حفظ كشف المريض '+window.patient.name);
  save(); toast('تم حفظ بيانات الكشف');
};

window.markDone=(id)=>{
  const b=DB.bookings.find(x=>x.id===id);
  if(b){b.status='done';addLog('تم الكشف للحجز '+b.name);save();toast('تم تعليم الحجز كمنتهي');go('exam')}
};

    const list=DB.patients.filter(p=>!q || p.name.includes(q) || String(p.fileNo).includes(q));
    root.innerHTML=`<div class="page"><div class="page-head"><div class="title">${iconSearch()} بحث المرضى</div></div>
    <div class="page-body">

pages.stats=(root)=>{
  const today=todayISO();
  const todayBk=DB.bookings.filter(b=>b.date===today);
  const monthKey=today.slice(0,7);
  const monthBk=DB.bookings.filter(b=>b.date.startsWith(monthKey));
  const monthIncome=DB.cash.filter(c=>c.date.startsWith(monthKey)&&c.type==='in').reduce((s,x)=>s+x.amount,0);
  const monthOut=DB.cash.filter(c=>c.date.startsWith(monthKey)&&c.type==='out').reduce((s,x)=>s+x.amount,0);
  const days=[];for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);days.push(d.toISOString().slice(0,10))}
  const counts=days.map(d=>DB.bookings.filter(b=>b.date===d).length);
  const max=Math.max(1,...counts);
  root.innerHTML=`<div class="page"><div class="page-head"><div class="title">${iconChart()} إحصائيات</div></div>
  <div class="page-body">
    <div class="grid4">
      <div class="stat"><div class="n">${todayBk.length}</div><div class="l">حجوزات اليوم</div></div>
      <div class="stat"><div class="n">${monthBk.length}</div><div class="l">حجوزات الشهر</div></div>
      <div class="stat"><div class="n">${monthIncome}</div><div class="l">إيراد الشهر</div></div>
      <div class="stat"><div class="n">${monthIncome-monthOut}</div><div class="l">صافي الشهر</div></div>
    </div>
    <div class="panel" style="margin-top:14px"><h3>حجوزات آخر 7 أيام</h3>
      <div style="display:flex;gap:8px;align-items:flex-end;height:180px;padding:10px;direction:ltr">
        ${counts.map((c,i)=>`<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px">
          <div style="background:linear-gradient(180deg,#1e6fbf,#0f4f8f);width:100%;height:${(c/max)*150}px;border-radius:4px 4px 0 0;color:#fff;display:flex;align-items:flex-start;justify-content:center;font-size:11px;padding:2px">${c||''}</div>
          <div style="font-size:11px;color:var(--muted)">${days[i].slice(5)}</div>
        </div>`).join('')}
      </div></div>
    <div class="toolbar"><button class="btn" onclick="go('home')">رجوع</button></div>
  </div></div>`;
};

function exportData(){const b=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download='clinic-backup-'+todayISO()+'.json';a.click();URL.revokeObjectURL(u)}
function importData(){const i=document.createElement('input');i.type='file';i.accept='application/json';i.onchange=()=>{const f=i.files[0];const r=new FileReader();r.onload=()=>{try{DB=JSON.parse(r.result);save();toast('تم الاسترداد');go('home')}catch{toast('ملف غير صالح')}};r.readAsText(f)};i.click()}
function resetData(){confirmBox('سيتم حذف جميع البيانات نهائياً، متابعة؟',()=>{DB=structuredClone(defaultDB);save();toast('تم الحذف');go('home')})}

    $('#add-lg').onclick=()=>{const g=$('#new-lg').value.trim(),t=$('#new-lt').value.split(',').map(x=>x.trim()).filter(Boolean);if(g&&t.length){s.labsTemplates.push({group:g,tests:t});save();render()}};
    $$('button[data-del]').forEach(b=>b.onclick=()=>{s.medicines.splice(+b.dataset.del,1);save();render()});
    $$('button[data-din]').forEach(b=>b.onclick=()=>{s.instructionsTemplates.splice(+b.dataset.din,1);save();render()});
    $$('button[data-dlg]').forEach(b=>b.onclick=()=>{s.labsTemplates.splice(+b.dataset.dlg,1);save();render()});
  };render();
};

/* ===== LOGIN (مصححة تماماً) ===== */
function doLogin(){
  const u=$('#lg-user').value.trim(), p=$('#lg-pass').value;
  const user=DB.users.find(x=>x.u.toLowerCase()===u.toLowerCase() && x.p===p);
  if(!user) return toast('بيانات الدخول غير صحيحة');
  addLog('تسجيل دخول '+u);
  save();
  $('#login').classList.add('hide');
  $('#sb-user').textContent=user.u;
  go('home');
}
function logout(){addLog('تسجيل خروج');$('#login').classList.remove('hide')}

function refreshMini(){
  const t=todayISO();
  const td=DB.bookings.filter(b=>b.date===t);
  $('#mini-today').textContent=td.length;
  $('#mini-wait').textContent=td.filter(b=>b.status==='wait').length;
  $('#mini-pat').textContent=DB.patients.length;
  $('#mini-cash').textContent=DB.cash.filter(c=>c.date===t&&c.type==='in').reduce((s,x)=>s+x.amount,0);
  $('#sb-clinic').textContent=DB.settings.clinic;
  $('#sb-date').textContent=fmtDate(new Date());
}
refreshMini();
</script>
